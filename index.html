<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Trip Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚌 School Trip Planner</h1>
            <p class="subtitle">Organize and manage your school trips efficiently</p>
        </header>

        <main>
            <section class="form-section">
                <h2>Plan a New Trip</h2>
                <form id="tripForm">
                    <div class="form-group">
                        <label for="tripName">Trip Name *</label>
                        <input type="text" id="tripName" required placeholder="e.g., Science Museum Visit">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="destination">Destination *</label>
                            <input type="text" id="destination" required placeholder="e.g., National Science Museum">
                        </div>

                        <div class="form-group">
                            <label for="tripDate">Date *</label>
                            <input type="date" id="tripDate" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentCount">Number of Students *</label>
                            <input type="number" id="studentCount" required min="1" placeholder="0">
                        </div>

                        <div class="form-group">
                            <label for="teacherCount">Number of Teachers *</label>
                            <input type="number" id="teacherCount" required min="1" placeholder="0">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="transportation">Transportation</label>
                            <select id="transportation">
                                <option value="Bus">Bus</option>
                                <option value="Train">Train</option>
                                <option value="Private Vehicle">Private Vehicle</option>
                                <option value="Walking">Walking</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="costPerStudent">Cost per Student ($)</label>
                            <input type="number" id="costPerStudent" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="activities">Planned Activities</label>
                        <textarea id="activities" rows="3" placeholder="e.g., Guided tour, Workshop, Lunch"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Notes</label>
                        <textarea id="notes" rows="3" placeholder="Any special requirements or notes..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Add Trip</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="trips-section">
                <div class="section-header">
                    <h2>Planned Trips</h2>
                    <div class="trip-stats">
                        <span id="tripCount">0 trips</span>
                    </div>
                </div>
                <div id="tripsList" class="trips-list">
                    <p class="empty-state">No trips planned yet. Add your first trip above!</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 School Trip Planner. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
